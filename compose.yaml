services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: promocode
      POSTGRES_USER: ${POSTGRES_USER:-promocode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promocode}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
